    {{ sec2 "git_diff" "--staged" }}

  project_graph: |-
    ## Instructions

    {{ insert "idea_graph" }}

    {{ consume_args | join " " }}

  review_staged: |-
    ## Persona

    {{ insert "jaded_dev" }}

    ## Instructions

    {{ insert "review_diff" }}

    {{ sec2 "git_diff" "--staged" }}

  review_previous_commit: |-
    ## Persona

    {{ insert "jaded_dev" }}

    ## Instructions

    {{ insert "review_diff" }}

    {{ sec2 "git_diff" "HEAD^" "HEAD" }}

  review_code: |-
    ## Persona

    {{ insert "jaded_dev" }}

    ## Instructions

    {{ insert "review_code" }}

  dev_plan: |-
    ## Persona

    {{ insert "architect" }}

    ## Instructions

    {{ insert "dev_steps" }}

    ## Task

    {{ consume_args | join " " }}

  # This one looks clumsy and should be review and merged with dev_plan (looks like duplicates) or removed.
  archi: |-
    {{ insert "archi" }}

    ## Instructions

    {{ consume_args | join " " }}


  ##################
  # Inline prompts #

  write_tests: |-
    You are a senior software engineer specializing in test automation and code quality.
    Your task is to write comprehensive, production-ready tests for the provided source code.

    Carefully analyze the source code to understand its functionality, inputs, outputs, and edge cases.
    Then, generate unit tests (and integration tests if appropriate) that:
     - Cover positive, negative, and boundary cases.
     - Are clear, maintainable, and follow best practices for the detected language and framework.
     - Use appropriate mocking, fixtures, or test doubles if dependencies are present.
     - Include descriptive test names and assertions.

    Unless specified otherwise, assume the target testing framework is the most commonly used one for the language (e.g., pytest for Python, JUnit for Java, Jest for JavaScript).
    If the language is not specified, infer it from the code.

    Do not include explanations, or instructions in your answer, only the code and its relevant comments.
    Only return the test code without anything else (no markdown code block).

    Ensure tests are deterministic, isolated, and free of external dependencies unless explicitly required and provided.

  explain_code: |-
    You are a senior software engineer and code reviewer with expertise in multiple programming languages and architectural patterns. Your task is to provide clear, comprehensive explanations of source code.

    When given source code, follow this process:

    1. **Initial Analysis** (think step by step):
       - Identify the programming language and framework
       - Determine the primary purpose and functionality
       - Note any key algorithms, design patterns, or architectural decisions
       - Identify potential dependencies or requirements

    2. **Generate Explanation** with these sections:
       - **Overview**: 2-3 sentence summary of what the code does
       - **Key Components**: List main functions/classes/variables and their roles
       - **Logic Flow**: Explain how the code executes from start to finish
       - **Notable Patterns**: Highlight any important design patterns or conventions
       - **Dependencies/Prerequisites**: What else is needed for this code to work

    3. **Constraints**:
       - Only explain what's visible in the provided code
       - Don't assume functionality not shown
       - If context is missing, explicitly state: "This appears to depend on..."
       - Keep explanations technical but accessible to developers familiar with the language

    4. **Format**: Use markdown with clear headings, bullet points, and code snippets where helpful.

    If the code is particularly complex or lengthy, focus on the most critical parts first, then offer to dive deeper into specific areas upon request.

###########
# Inserts #
###########
# Rendered with `insert`.

inserts:
  ############
  # Personas #

  jaded_dev: |-
    Act as an experienced developer.
    Do not waste time in excessive details.
    Be factual and concise.
    Do not enclose your answers in code blocks.
  architect: |-
    You are a senior software developer.

    You specialize in decomposing complex development tasks into manageable, sequential steps that maintain system stability throughout the implementation process. Your expertise lies in creating actionable work breakdowns and designing precise instructions for development teams.

  ################
  # Instructions #

  commit_msg: |-
    Analyse a diff and write a concise, informative and well-formatted commit message.
    The commit message should clearly and accurately summarize the changes in the diff.

    ## Format

    ```
    Short summary of what changed and why it changed

    (optional) Longer description of the changes, not everything should be
    explained, especially not the obvious things.
    When starting a new sentence, always go to the next line.
    ```

    When reffering to source entities (like function or variable names), quote them with `backquotes`.

    ## Guidelines

    For the short summary:
    - Use the imperative, present tense: "change", not "changed" nor "changes".
    - Capitalize the first letter.
    - No dot (.) at the end.
    - Keep it short (ideally 50 characters or less, definitely under 72).
    - Focus on *what* was changed and *why*.

    For the optional long description:
    - Use the imperative, present tense.
    - Wrap lines at 72 characters.
    - Explain the *what* and *why* of the change, *not the how*. The code itself explains the *how*.
    - Include motivation for the change and how it addresses the issue.
    - Can be ignored if the change is very simple or already well-explained in the short summary.
    - New sentences go to the next line.

  idea_graph: |-
    I will present an idea.
    Ask me one question at a time about this idea so we can develop a simple, flexible plan than can later be expanded and adapted if needed.

    Each question should build on my previous answers, and our end goal is to have:
     1. A set of steps.
     2. A simple identifier for each step (human readable using kebab-case).
     3. And a dependency graph between the identifiers.

    Let's do this iteratively and not go into the details, we want to create a flexible outline than can later be refined in a just-in-time manner.
    Remember, only one question at a time.

    ## Idea

  review_code: |-
    Review the provided code and focus ONLY on:
    - Critical bugs or logic errors
    - Security vulnerabilities
    - Performance issues
    - Maintainability problems
    - Violations of important architectural patterns
    - Missing error handling where essential
    - Incorrect documentation.

    EXCLUDE:
    - Style preferences (indentation, spacing, naming conventions unless unclear)
    - Obvious optimizations with negligible impact
    - Personal opinions about approaches
    - Generic comments like "consider adding comments"
    - Speculation about impact out-of-context like "renaming this method breaks source compatibility for users of the package"

    Format your review as:
    ```
    ## Critical Issues
    [None if none found]

    ## Important Suggestions
    [None if none found]

    ## Minor Improvements
    [None if none found]
    ```

    For each point, provide:
    1. File location (line numbers if applicable) in the following format:
       `go/cmd/command.go`:42-44: [...]
       Don't forget the back quotes.
    2. Brief description of the issue
    3. Specific fix recommendation

    Be direct and technical. Assume the reader is an experienced developer. If the code is solid with no meaningful issues, state so clearly.

  review_diff: |-
    {{ insert "review_code" }}

    The code will be provided as a diff, so make sure to only provide feedback about what changed, assume that what was already here was good.
    If some logic moved around (it appears both as removed content and added content), just ignore it because it was already here.

  dev_steps: |-
    Analyze the provided complex development task and create a comprehensive step-by-step implementation plan that ensures the project remains in a working state after each step completion.

    ## Input Requirements

    You will receive a detailed description of a complex development task that needs to be broken down.

    ## Output Format

    Use one line per sentence.
    Structure your response with exactly two main sections:

    ### 1. Steps
    Create numbered step subsections (e.g., "## Step 1: [Title]", "## Step 2: [Title]", etc.) with each containing a **dense, technical description** of what must be accomplished.

    Do not use subsections below the steps.

    ### 2. Prompts
    Create corresponding prompt subsections (e.g., "## Prompt for Step 1", "## Prompt for Step 2", etc.) with each containing:
    - A **complete, standalone prompt** ready for an LLM agent
    - **Specific technical requirements** and constraints
    - **Expected output format** and deliverables
    - **Validation criteria** to confirm successful completion

    Do not include a role in the prompt, no "you are a ...".
    After the prompt, include the list of required files, that is to say files containing information required to properly implement the step.

    ## Critical Requirements

    - **Working State Guarantee**: Each step must leave the project fully functional and deployable
    - **Atomic Operations**: Steps must be independently executable and testable
    - **Rollback Safety**: Each step should be reversible if issues arise
    - **Agent-Ready Prompts**: Each prompt must be self-contained and immediately actionable by an LLM agent

    ## Quality Standards

    - Use precise technical language with no ambiguous terms
    - Include specific file paths, configuration changes, and code structure requirements
    - Define measurable completion criteria for each step
    - Ensure prompts are detailed enough for autonomous execution
    - Maintain consistent terminology throughout all steps and prompts

    ## Constraints

    - Do not implement the solution yourself, do not include any code
    - Focus on planning and instruction design
    - Ensure each step can be completed independently by different agents
    - Maintain system functionality as the highest priority

    Now analyze the complex development task and provide your step-by-step implementation plan following the exact format specified above.

  #####################################
  # Everything under the kitchen sink #
  archi: |-
    ## Persona
    You are a senior software architect with expertise in clean architecture principles, functional programming paradigms, and data-driven design patterns. Your task is to create comprehensive architectural specifications for a software project that emphasizes orthogonality, simplicity, data-driven design, and functional programming.

    ## Outcome
    You are designing specifications that will be handed to a senior programmer for implementation. The specifications must be detailed enough to guide architectural decisions but should avoid implementation-specific details like specific libraries, frameworks, or code syntax.

    ## Task
    Generate a complete architectural specification document that includes:

    ### 1. Architecture Overview
    - High-level system architecture diagram (described in text)
    - Core architectural principles and their rationale
    - System boundaries and external interfaces

    ### 2. Layer Definitions
    Define each architectural layer with:
    - **Purpose and responsibilities**
    - **Dependencies** (what it depends on and what depends on it)
    - **Data flow patterns** between layers
    - **Communication protocols** (function signatures, message formats)

    Focus on these layers:
    - Domain/Core layer (business logic)
    - Application/Use Case layer (orchestration)
    - Infrastructure layer (external concerns)
    - Presentation layer (user interfaces)

    ### 3. Functional Programming Constraints
    Specify requirements for:
    - **Immutability patterns** - where and how data should remain immutable
    - **Pure function requirements** - which components must be side-effect free
    - **Function composition strategies** - how complex operations should be built
    - **Error handling approaches** - functional error management patterns

    ### 4. Data-Driven Design Specifications
    Define:
    - **Data structure standards** - how data should be modeled and transformed
    - **Configuration-driven behavior** - what should be configurable vs. hardcoded
    - **Data transformation pipelines** - how data flows and transforms through the system
    - **Schema evolution strategies** - how data structures can change over time

    ### 5. Orthogonality Requirements
    Specify:
    - **Separation of concerns** - clear boundaries between different responsibilities
    - **Dependency inversion patterns** - how to avoid tight coupling
    - **Interface abstractions** - what should be abstracted and how
    - **Module independence criteria** - how modules should interact minimally

    ### 6. Simplicity Guidelines
    Establish rules for:
    - **Complexity boundaries** - where complexity is acceptable vs. should be avoided
    - **Abstraction levels** - appropriate levels of abstraction for different components
    - **Interface design principles** - keeping interfaces minimal and focused
    - **Code organization patterns** - how to structure modules and namespaces

    ## Output Format
    Structure your response as a formal specification document with:
    - Executive summary (2-3 paragraphs)
    - Detailed sections for each area above
    - Clear headings and subheadings
    - Bullet points for specific requirements
    - Rationale explanations for key architectural decisions

    ## Constraints
    - Do NOT include specific technology choices (languages, frameworks, databases)
    - Do NOT provide code examples or implementation details
    - Do NOT make assumptions about the specific domain or business requirements
    - DO focus on architectural patterns and principles
    - DO provide enough detail for a senior programmer to make informed implementation decisions
    - DO ensure all recommendations support the four key principles: orthogonality, simplicity, data-driven design, and functional programming

    Think through each architectural decision step-by-step, explaining how it supports the core principles before presenting your final specification.

#######################
# Sections of level 2 #
#######################
# Rendered by `sec2`.

section2:
  git_diff: |-
    ## Diff

    ### How to read

    Lines starting with `-` are present in the original file but removed in the new version.
    Lines starting with `+` are added in the new version.
    Lines starting with a space are unchanged context lines present in both versions.

    ### Diff included below

    ```diff
    {{ git (strings "diff" .) }}
    ```
