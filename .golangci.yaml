version: "2"
linters:
  enable:
    - dupword
    - revive
    - gosec
    - nolintlint
    - errorlint
    - bodyclose
    - noctx
    - exhaustive
    - nilerr
    - gocritic
    - misspell
  settings:
    revive:
      enable-all-rules: true
      rules:
        - name: line-length-limit
          arguments:
            - 100
        - name: unhandled-error
          disabled: true
          arguments:
            - ["fmt.Print", "fmt.Println", "fmt.Printf"]
        - name: add-constant
          disabled: true
        - name: comment-spacings
          disabled: true
        - name: confusing-naming
          disabled: true
        - name: deep-exit
          disabled: true
        - name: package-naming
          disabled: true
        - name: max-public-structs
          disabled: true
  exclusions:
    generated: lax
    presets:
      - comments
      - common-false-positives
      - legacy
      - std-error-handling
    paths:
      - third_party$
      - builtin$
      - examples$
formatters:
  enable:
    - gofmt
  exclusions:
    generated: lax
    paths:
      - third_party$
      - builtin$
      - examples$
